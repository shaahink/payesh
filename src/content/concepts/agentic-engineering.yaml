tryIt:
  - command: "conductor start --dry-run"
    note: "Takes one turn of the loop without spending anything: it picks the stage,
      composes the prompt it would have sent, prints it, and stops. If the
      composition is going to be refused, this is where you find out."
  - command: "conductor journey"
    note: "The run as a sequence of sessions — kind, model, outcome, cost. The shape
      of a run that is working and one that is thrashing are different at a
      glance, and this is the glance."
  - command: "conductor history --json --limit 0"
    note: "Every run the engine has ever recorded, with checkpoints closed against
      checkpoints planned. Every corpus figure on this site is folded out of
      this one command."

