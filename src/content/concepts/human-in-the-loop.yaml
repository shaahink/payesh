tryIt:
  - command: "gh pr status"
    note: "The shape, in a tool you probably already have. The last section is the
      list of things waiting specifically on you, derived fresh each time from
      the state that raised them rather than from a list anybody maintains.
      Notice what it does not tell you: what each one is holding up, and what
      exactly clears it."
  - command: "cat .conductor/OWNER-QUEUE.md"
    note: "The rendered queue, rewritten at every session boundary. When nothing is
      waiting on you it says so in a sentence, because a file that simply stops
      after its header cannot be told apart from a stale one."
  - command: "conductor approve"
    note: "Clears whichever park the run is actually sitting in, which is not always
      the same act. On a gated stage it confirms the stage; before a session
      under approval mode it runs exactly that one session; on a budget park it
      resets the window and continues."

