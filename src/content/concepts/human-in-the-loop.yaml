meta:
  title: "Human in the loop"
  description: "A stop the machine cannot pass without a person. What makes one
    worth having: what it is, what it unblocks, and the exact command that
    clears it."
  ogDescription: "Oversight is not watching. It is a place the machine stops, that
    says exactly what clears it."
  canonical: "/concepts/human-in-the-loop/"

