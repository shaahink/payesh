meta:
  title: "Payesh — a field guide to agentic engineering"
  description: "A month of running an orchestrator against real repositories, and
    the record it kept: what worked, what was wasted, and every figure
    recomputed from the store."
  ogDescription: "A month of autonomous runs against real repositories, and the
    record they kept — recomputed, not estimated."
  canonical: "/"

hero:
  title: "A field guide to agentic engineering"
  tagline: "Ten concepts and four longer pieces, worked end to end against a real
    record."
  # The answer to "what am I looking at", before any number. First person on
  # purpose: the corpus is one person's month, and a page that hides that reads
  # like a vendor's benchmark. Since 2026-08-13 the front page is the guide's —
  # the concepts and the articles — and the machine that produced the record
  # has a page of its own, pointed at from the section below the doors.
  # Two paragraphs since the owner's ask of the same day: the subject named
  # first — harness thinking, not autonomy for its own sake — and the month
  # that produced the evidence second.
  standfirst:
    - "The subject here is harness thinking: the working idea that the
      engineering lives in the rings around the model — the loop that runs it,
      the context it is handed, the gates that check it, the record it leaves —
      and not inside the model itself. The ten concepts are stated so they are
      useful anywhere, whether your harness runs for a minute at your elbow or
      all night on its own."
    - "The evidence is one month: I pointed an orchestrator I had built at my
      own repositories and let it work unattended — planning, spawning agents,
      running gates, recording what happened. This site is the field guide that
      came out of it, with four longer pieces built from what the record
      actually showed. Some of it went well, a good deal of it did not, and both
      are published, because a number nobody can check is an opinion with a
      decimal point."

spine:
  title: "The ten concepts"
  intro: "In order, but there is no wrong door — each page states the idea in
    plain language first, and only then shows how one orchestrator implements
    it."

reading:
  title: "Four longer pieces"
  intro: "Each one carries at least one number nobody else publishes, and each is
    written from the same store the concepts cite."

# The doors. Findings live with the record on the machine's page now; these
# are for the reader who arrived cold. Sorted by the question they came with,
# never by the site's own structure, and each destination is a collection
# reference the build resolves — a renamed page fails here rather than
# publishing a dead door.
orient:
  title: "Where to start"
  intro: "The site reads in any order, so these are doors rather than chapters —
    take the one that sounds like the question that brought you here."
  doors:
    - eyebrow: "new to all of this"
      blurb: "What an agent actually is, and where the engineering genuinely lives —
        in the loop around the model, not inside it. The first concept assumes
        nothing and defines its words as it goes."
      where:
        - "concepts/agentic-engineering"
        - "concepts/context-engineering"

    - eyebrow: "deciding what to trust"
      blurb: "An agent reporting that its work is done is not the work being done. How
        checking gets separated from doing, and what a month of gate results
        said about believing the agent."
      where:
        - "concepts/evals-and-gates"
        - "articles/never-believe-the-agent"

    - eyebrow: "here for the bill"
      blurb: "What a month of autonomous runs actually cost, where the money went, and
        why the length of a session dominates every other variable an
        orchestrator can turn."
      where:
        - "articles/what-a-run-costs"
        - "concepts/token-economics"

# The one place the front page names the tool, and it is a door rather than a
# pitch: the machine, its concept map, and the whole record — the corpus
# figures, the findings, the runs in depth — moved to /conductor/ on
# 2026-08-13, so the guide and the tool stopped sharing a page.
conductor:
  title: "The machine behind it"
  body:
    - "Every figure on this site was produced by one orchestrator — Conductor, a
      machine I built that plans, spawns agent sessions, gates them, and records
      what happened in a store the run cannot edit. What it is made of, how a
      run is declared, where each of the ten concepts lives in the mechanism,
      and the full record it kept — the corpus in numbers, the findings, the
      runs in depth — now live on their own page."

ways:
  title: "Or start from a subject"
  intro: "The three sections say what kind of page something is. These say what it
    is about, and each one gathers concepts, articles and run reports together."

# A section the owner can turn off from the editor. `visible` is absent here on
# purpose: absent means shown, and that is the point of the default — the
# switch writes the field the first time it is used, and content files that
# predate the feature keep working untouched.
notes:
  title: "How to read this"
  body: "No figure here was typed by hand. A page names an evidence key; the value
    comes from a corpus recomputed from Conductor's own run store, and a page
    citing a key the corpus does not have fails the build. The failures are
    published beside the wins, because the waste and the abandoned runs are part
    of what a run costs."
