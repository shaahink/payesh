meta:
  title: "The nudge that sat below the median"
  description: "A token ceiling is usually a guess. Measuring one properly means
    noticing that the measurement you need is the one the ceiling destroys."
  ogDescription: "How to measure a session token budget instead of guessing it,
    and why a cap censors its own evidence."
  canonical: "/articles/the-nudge-below-the-median/"
  ogType: "article"

slug: "the-nudge-below-the-median"
order: 3
title: "The nudge that sat below the median"
tags:
