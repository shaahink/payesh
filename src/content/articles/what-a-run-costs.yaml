meta:
  title: "What an autonomous run actually costs"
  description: "The whole bill for a corpus of autonomous runs, including the
    money that bought nothing: the lanes, the cache reads, and the two stages
    where the waste sat."
  ogDescription: "The whole bill for a corpus of autonomous runs, including the
    money that bought nothing."
  canonical: "/articles/what-a-run-costs/"
