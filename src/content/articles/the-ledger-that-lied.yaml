meta:
  title: "The ledger that lied"
  description: "One population of sessions in this corpus has a record that is
    empty in four places and full in the fifth. The shape of the hole turned out
    to be a code path."
  ogDescription: "How a telemetry defect produced a complete, consistent,
    confident table that was wrong about one population of sessions."
  canonical: "/articles/the-ledger-that-lied/"
  ogType: "article"

slug: "the-ledger-that-lied"
order: 4
title: "The ledger that lied"
tags:
  - "measurement"
  - "failure"
  - "context"
linkAs:
  - "result summary"
  - "gate summary"
standfirst: "An autonomous run keeps a record of itself, and that record is what
  every later decision gets made from. This corpus holds a population of
  sessions whose record is empty in four places and full in the fifth. The shape
  of the hole turned out to be a code path, and the number it produced was the
  reassuring one."

