meta:
  title: "The long build"
  description: "A large interactive feature built inside an existing site by an
    autonomous run that ended one checkpoint short, and what the store says
    about why."
  ogDescription: "The run that ended one checkpoint short, published with the
    shortfall as the subject."
  canonical: "/runs/the-long-build/"
  ogType: "article"

slug: "the-long-build"
order: 2
title: "The long build"
tags:
  - "failure"
  - "cost"
  - "autonomy"
  - "people"
scenario: "A large interactive feature built inside an existing site, and the
  checkpoint that never closed"
standfirst: "This is the run that did not finish. It is here on purpose and it
  is the most useful report on the site, because the store recorded exactly why
  the last checkpoint stayed open and the answer was not the model, the plan or
  the code. It was a ceiling."

