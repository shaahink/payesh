meta:
  title: "The fleet round"
  description: "A four-site web fleet taken through a round of coordinated
    changes, and what coordination cost measured against the same fleet's
    ordinary backlog."
  ogDescription: "A four-site web fleet, one shared component library, one round
    of coordinated changes."
  canonical: "/runs/the-fleet-round/"
  ogType: "article"

slug: "the-fleet-round"
order: 1
title: "The fleet round"
tags:
  - "orchestration"
  - "cost"
  - "people"
scenario: "A four-site web fleet, one shared component library, one round of
  coordinated changes"
standfirst: "The shape of the work, not the client. A change that has to land
  the same way on several sites at once is where an orchestrator earns its keep,
  and it is also where a half-applied change is worst. The store has the same
  fleet doing ordinary work either side of it, which is what makes the round
  readable."

evidence:
  runs:
    - "the-fleet-backlog"
    - "the-fleet-round"
    - "the-fleet-round-after"
  figures:
    - "sessions"
    - "checkpointsDone"
    - "costUsd"
    - "tokensPerCheckpoint"
