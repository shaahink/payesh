scenario: "A static-analysis engine for a compiled language, with an evaluation
  suite as the release gate"
standfirst: "Every checkpoint closed, and this is still the reddest run in the
  corpus. It holds nearly a third of every gate failure measured here, every
  unusual failure exit code in the whole store, and the only gates that never
  ran at all. That combination is not a contradiction. It is what a real release
  gate looks like."

